<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phonics">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2a5bd7">
<title>Daily Phonics 拼读天天练</title>
<style>
:root{--bg:#faf8f3;--card:#fff;--tx:#111;--bd:#ddd;--red:#d62828;--ac:#2a5bd7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#25262b;--tx:#f2f2f2;--bd:#3a3b41;--red:#ff6b6b;--ac:#7aa2ff}}
:root[data-theme="dark"]{--bg:#17181b;--card:#25262b;--tx:#f2f2f2;--bd:#3a3b41;--red:#ff6b6b;--ac:#7aa2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;font-size:30px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{font:inherit;font-size:16px;padding:8px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
h1{font-size:40px;font-weight:bold;color:var(--tx);text-align:center;margin:8px 0 18px;line-height:1.2}
.foot{font-size:30px;color:var(--tx);text-align:center;margin:28px 0 8px}
.sp{flex:1}#who{font-size:16px;opacity:.8}
#lg{text-align:center}#lg p{font-size:20px;margin:8px 0}
#nm{font:inherit;width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);text-align:center}
.chip{font:inherit;font-size:26px;padding:10px 20px;margin:6px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);cursor:pointer}
.st{font-size:18px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}.card b{display:block;font-size:28px}
.st table{width:100%;border-collapse:collapse;margin:8px 0 18px}.st td,.st th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.st select,.st button{font:inherit;font-size:16px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.st h3{font-size:20px;margin:16px 0 4px}
.hint{font-size:15px;opacity:.7;margin:0 0 12px}
.list{display:grid;gap:10px}
.w{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 20px;font-family:Arial,sans-serif;font-size:30px;letter-spacing:1px}
.r{color:var(--red);font-weight:bold}
.syl{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px;margin-right:8px}
.syl:last-child{margin-right:0}
#go{font:inherit;font-size:22px;margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
#next{margin-top:18px;width:100%;font:inherit;font-size:22px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
</style></head><body><div class="wrap">
<h1>Daily Phonics 拼读天天练</h1>
<div id="lg"><p>Who is practicing? 请输入名字</p><input id="nm" maxlength="30" placeholder="Name 名字" autocomplete="off">
<button id="go">Start 开始</button><p style="margin-top:22px">Recent 最近使用</p><div id="rc"></div></div>
<div id="ap" hidden><div class="tabs"><button id="tp" class="on">Practice 练习</button><button id="ts">Records 记录</button><span class="sp"></span><span id="who"></span><button id="sw">Switch 换人</button></div>
<div id="pv">
<div class="tabs" id="tabs"></div>
<p class="hint" id="hint"></p>
<div class="list" id="list"></div>
<button id="next">Next Group ▶</button>
</div><div id="sv" class="st" hidden></div></div>
<div class="foot">Paul 林老师学生专用</div>
</div>
<script>
// [ ] = red part, | = syllable break
const D={
short:{a:["c[a]t","m[a]p","h[a]t","b[a]g","s[a]d","p[a]n","j[a]m","t[a]p","v[a]n","d[a]d"],
e:["b[e]d","p[e]n","r[e]d","n[e]t","l[e]g","w[e]b","h[e]n","t[e]n","j[e]t","w[e]t"],
i:["p[i]g","s[i]t","b[i]n","l[i]p","h[i]t","p[i]n","b[i]g","s[i]x","d[i]g","k[i]d"],
o:["d[o]g","h[o]t","p[o]t","m[o]p","b[o]x","t[o]p","f[o]x","l[o]g","j[o]b","n[o]d"],
u:["b[u]s","c[u]p","s[u]n","m[u]d","b[u]g","r[u]n","n[u]t","h[u]g","g[u]m","t[u]b"]},
long:{a:["c[a]ke","n[a]me","g[a]me","l[a]ke","g[a]te","m[a]ke","t[a]pe","f[a]ce"],
e:["th[e]se","th[e]me","[e]ve","g[e]ne","P[e]te"],
i:["b[i]ke","f[i]ve","k[i]te","n[i]ne","t[i]me","l[i]ke","h[i]de","l[i]ne"],
o:["b[o]ne","h[o]me","n[o]se","r[o]pe","n[o]te","st[o]ne","h[o]le","c[o]de"],
u:["c[u]be","t[u]be","h[u]ge","m[u]le","c[u]te","J[u]ne","r[u]le","fl[u]te"]},
dip:["c[oi]n","b[oi]l","[oi]l","s[oi]l","t[oy]","b[oy]","[ou]t","h[ou]se","cl[ou]d","m[ou]se","c[ow]","n[ow]","d[ow]n","t[ow]n","br[ow]n","s[aw]","p[aw]","dr[aw]","m[oo]n","b[oo]k","f[oo]d","r[ai]n","tr[ai]n","t[ai]l","d[ay]","pl[ay]","s[ay]","tr[ee]","f[ee]t","t[ea]m","b[oa]t","c[oa]t","r[oa]d","n[ew]","gl[ue]"],
dig:["[sh]ip","[sh]op","fi[sh]","[sh]ell","[ch]ip","[ch]air","lun[ch]","mu[ch]","[th]in","[th]is","ba[th]","[th]ink","[wh]ale","[wh]en","du[ck]","ba[ck]","so[ck]","ri[ng]","so[ng]","ki[ng]","[ph]one","[kn]ee","[kn]ife","[wr]ite"],
two:["ta|ble","rab|bit","pen|cil","ba|by","ti|ger","mon|key","flow|er","ap|ple","or|ange","sun|set","to|day","hap|py","pic|nic","win|dow","but|ter","sis|ter","yel|low","pa|per","ba|con","lem|on","car|rot","ro|bot","mu|sic","ta|ble","gar|den","rain|bow"]};
const T=[["short","Short Vowel 短元音","CVC：红色=元音字母"],["long","Long Vowel 长元音","VCe（silent e）：红色=元音字母"],["dip","Diphthong 复合元音","红色=复合元音"],["dig","Digraph 复合辅音","红色=digraph"],["two","2 Syllables 双音节","下划线=音节"]];
let cur="short";
const pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
const one=o=>Object.values(o).map(a=>a[Math.floor(Math.random()*a.length)]);
function html(w){
  if(w.includes("|"))return w.split("|").map(s=>`<span class="syl">${s}</span>`).join("");
  return w.split(/(\[.*?\])/).map(p=>p[0]==="["?`<span class="r">${p.slice(1,-1)}</span>`:p).join("");
}
function render(){
  const words=cur==="short"||cur==="long"?one(D[cur]):pick(D[cur],5);
  list.innerHTML=words.map(w=>`<div class="w">${html(w)}</div>`).join("");
}
function tabs(){
  document.getElementById("tabs").innerHTML=T.map(t=>`<button class="${t[0]===cur?"on":""}" data-k="${t[0]}">${t[1]}</button>`).join("");
  hint.textContent=T.find(t=>t[0]===cur)[2];
}
document.getElementById("tabs").onclick=e=>{const k=e.target.dataset.k;if(k){cur=k;tabs();render();}};
next.onclick=render;
tabs();render();

/* ===== v1.5 users & usage tracking ===== */
const IDLE=180000,S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let users=S.get("pa_users",[]),sessions=S.get("pa_sessions",[]),user=null,ses=null,last=0,lastSave=0,tab="practice",su=null;
const save=()=>{S.set("pa_sessions",sessions);S.set("pa_users",users)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const p2=n=>String(n).padStart(2,"0");
const fd=t=>{const d=new Date(t);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const ft=t=>{const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes())};
function fmt(ms){const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:m?`${m}m ${s%60}s`:`${s}s`}
const dayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const ov=(s,e,a,b)=>Math.max(0,Math.min(e,b)-Math.max(s,a));
const span=(name,a,b)=>sessions.filter(x=>x.u===name).reduce((t,x)=>t+ov(x.s,x.e,a,b),0);
function touch(){
  if(!user||tab!=="practice")return;
  const n=Date.now();
  if(ses&&n-last>IDLE){save();ses=null}
  if(!ses){ses={u:user,s:n,e:n};sessions.push(ses);const u=users.find(x=>x.name===user);if(u)u.last=n;save();lastSave=n}
  else{ses.e=n;if(n-lastSave>5000){save();lastSave=n}}
  last=n;
}
["pointerdown","keydown","touchstart","scroll"].forEach(ev=>document.addEventListener(ev,touch,{passive:true,capture:true}));
setInterval(()=>{if(ses&&Date.now()-last>IDLE){save();ses=null}},10000);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
addEventListener("pagehide",save);
function drawLogin(){
  const r=[...users].sort((a,b)=>b.last-a.last).slice(0,5);
  rc.innerHTML=r.map(u=>`<button class="chip" data-n="${esc(u.name)}">${esc(u.name)}</button>`).join("")||'<p class="hint">No users yet 还没有记录</p>';
}
function show(v){lg.hidden=v!=="login";ap.hidden=v!=="app";if(v==="login"){user=null;ses=null;nm.value="";drawLogin()}}
function setTab(t){
  tab=t;pv.hidden=t!=="practice";sv.hidden=t!=="stats";
  tp.classList.toggle("on",t==="practice");ts.classList.toggle("on",t==="stats");
  if(t==="stats"){save();drawStats()}else touch();
}
function doLogin(name){
  name=name.trim();if(!name)return;
  let u=users.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!u){u={name,last:0};users.push(u)}
  u.last=Date.now();user=u.name;ses=null;su=user;save();
  who.textContent="👤 "+user;show("app");setTab("practice");
}
function drawStats(){
  if(!users.length){sv.innerHTML="<p>No data yet 暂无记录</p>";return}
  if(!users.some(u=>u.name===su))su=user||users[0].name;
  const d0=dayStart(),w0=weekStart(),mine=sessions.filter(x=>x.u===su);
  const opts=[...users].sort((a,b)=>b.last-a.last).map(u=>`<option value="${esc(u.name)}"${u.name===su?" selected":""}>${esc(u.name)}</option>`).join("");
  const log=[...mine].reverse().slice(0,20).map(x=>`<tr><td>${fd(x.s)}</td><td>${ft(x.s)} – ${ft(x.e)}</td><td>${fmt(x.e-x.s)}</td></tr>`).join("");
  const all=[...users].sort((a,b)=>b.last-a.last).map(u=>`<tr><td>${esc(u.name)}</td><td>${fmt(span(u.name,d0,Infinity))}</td><td>${fmt(span(u.name,w0,Infinity))}</td><td>${fd(u.last)} ${ft(u.last)}</td></tr>`).join("");
  sv.innerHTML=`<div>Student 学生: <select id="su">${opts}</select></div>
<div class="cards"><div class="card">Today 今日<b>${fmt(span(su,d0,Infinity))}</b></div><div class="card">This week 本周 (Mon–Sun)<b>${fmt(span(su,w0,Infinity))}</b></div>
<div class="card">Sessions 次数<b>${mine.length}</b></div><div class="card">Total 累计<b>${fmt(span(su,0,Infinity))}</b></div></div>
<h3>Recent sessions 最近记录</h3><table><tr><th>Date</th><th>Time</th><th>Duration</th></tr>${log||"<tr><td colspan=3>–</td></tr>"}</table>
<h3>All students 所有学生</h3><table><tr><th>Name</th><th>Today</th><th>Week</th><th>Last used</th></tr>${all}</table>
<p class="hint">Records are saved on this device/browser only. 记录只保存在本设备。</p>
<button id="clr">Clear all records 清除所有记录</button>`;
}
sv.addEventListener("change",e=>{if(e.target.id==="su"){su=e.target.value;drawStats()}});
sv.addEventListener("click",e=>{if(e.target.id==="clr"&&confirm("Delete ALL records? 确定删除所有记录？")){users=[];sessions=[];ses=null;save();su=null;drawStats()}});
rc.addEventListener("click",e=>{const n=e.target.dataset.n;if(n)doLogin(n)});
go.onclick=()=>doLogin(nm.value);
nm.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin(nm.value)});
tp.onclick=()=>setTab("practice");ts.onclick=()=>setTab("stats");
sw.onclick=()=>{save();ses=null;show("login")};
show("login");
if("serviceWorker"in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script></body></html>
